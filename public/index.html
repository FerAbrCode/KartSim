<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KartSim</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="ui">
      <div id="menu" class="panel">
        <h1>KartSim</h1>

        <label class="row">
          <span>Name</span>
          <input id="playerName" maxlength="16" placeholder="Player" />
        </label>

        <label class="row">
          <span>Flag</span>
          <div class="flagRow">
            <select id="playerFlag"></select>
            <div id="flagPreview" class="flagPreview" aria-hidden="true">
              <img id="flagPreviewImg" class="flagPreviewImg" alt="" />
              <span id="flagPreviewText">🇺🇸</span>
            </div>
          </div>
        </label>

        <label class="row">
          <span>Map</span>
          <select id="mapSelect"></select>
        </label>

        <div class="row">
          <span>RPG</span>
          <div class="musicRow">
            <label class="range">
              <span>Reload</span>
              <input id="rpgReload" type="range" min="200" max="1200" value="520" />
            </label>
            <label class="range">
              <span>Impact</span>
              <input id="rpgImpact" type="range" min="120" max="420" value="260" />
            </label>
          </div>
        </div>

        <div class="row">
          <span>Music</span>
          <div class="musicRow">
            <label class="check">
              <input id="musicMute" type="checkbox" />
              <span>Mute</span>
            </label>
            <label class="range">
              <span>Intensity</span>
              <input id="musicIntensity" type="range" min="0" max="100" value="60" />
            </label>
          </div>
        </div>

        <button id="startBtn" class="primary">Start Race</button>

        <div class="help">
          <div><b>Controls</b></div>
          <div>W/S: forward/back · A/D: steer</div>
          <div>Space tap: jump · Space hold: drift (tighter turns)</div>
          <div>Mouse click: fire RPG at cursor · Esc: pause</div>
        </div>
      </div>

      <div id="hud" class="hud hidden">
        <div id="hudLeft">
          <div id="lapText">Lap 1/3</div>
          <div id="posText">Position 1/5</div>
        </div>
        <div id="hudRight">
          <div id="speedText">0</div>
        </div>
      </div>

      <div id="results" class="panel hidden">
        <h2>Results</h2>
        <ol id="leaderboard"></ol>
        <button id="backBtn">Back to Menu</button>
      </div>

      <div id="pause" class="panel hidden pausePanel">
        <h2>Paused</h2>
        <div class="pauseHelp">Esc: resume</div>
        <label class="check pauseMute">
          <input id="pauseMute" type="checkbox" />
          <span>Mute music</span>
        </label>
        <label class="range pauseRange">
          <span>Sound</span>
          <input id="pauseIntensity" type="range" min="0" max="100" value="60" />
        </label>
        <div class="pauseActions">
          <button id="resumeBtn" class="primary">Resume</button>
          <button id="exitBtn">Exit to Menu</button>
        </div>
      </div>

      <div id="toast" class="toast hidden"></div>
    </div>

    <canvas id="game"></canvas>

    <script type="module" src="/build/main.js"></script>
  </body>
</html>
